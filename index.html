        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[31.13058782405798,29.801798068527248],[31.229406999058224,29.987654132277704]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OSMWeb_0');
        map.getPane('pane_OSMWeb_0').style.zIndex = 400;
        var layer_OSMWeb_0 = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            pane: 'pane_OSMWeb_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_OSMWeb_0;
        map.addLayer(layer_OSMWeb_0);
        function pop_01_healthcare_accessibility_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>Facility_Name</strong><br />' + (feature.properties['Facility_Name'] !== null ? autolinker.link(String(feature.properties['Facility_Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">District</th>\
                        <td>' + (feature.properties['District'] !== null ? autolinker.link(String(feature.properties['District']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Facility_Type</th>\
                        <td>' + (feature.properties['Facility_Type'] !== null ? autolinker.link(String(feature.properties['Facility_Type']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Beds</th>\
                        <td>' + (feature.properties['Beds'] !== null ? autolinker.link(String(feature.properties['Beds']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Emergency_24_7</th>\
                        <td>' + (feature.properties['Emergency_24_7'] !== null ? autolinker.link(String(feature.properties['Emergency_24_7']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Daily_Patients</th>\
                        <td>' + (feature.properties['Daily_Patients'] !== null ? autolinker.link(String(feature.properties['Daily_Patients']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Rating</th>\
                        <td>' + (feature.properties['Rating'] !== null ? autolinker.link(String(feature.properties['Rating']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Ownership</th>\
                        <td>' + (feature.properties['Ownership'] !== null ? autolinker.link(String(feature.properties['Ownership']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Status</th>\
                        <td>' + (feature.properties['Status'] !== null ? autolinker.link(String(feature.properties['Status']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_01_healthcare_accessibility_1_0(feature) {
            switch(String(feature.properties['Facility_Type'])) {
                case 'Specialist Hospital':
                    return {
                pane: 'pane_01_healthcare_accessibility_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(48,18,59,1.0)',
                interactive: true,
            }
                    break;
                case 'Primary Care Center':
                    return {

                color: 'rgba(35,35,35,1.0)',
                dashArray: '',

                lineJoin: 'miter',

            }
                    break;
                case 'General Hospital':
                    return {
                pane: 'pane_01_healthcare_accessibility_1',

                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,

                interactive: true,
            }
                    break;
                case 'Clinic':
                    return {
                pane: 'pane_01_healthcare_accessibility_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(251,126,33,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_01_healthcare_accessibility_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(122,4,3,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_01_healthcare_accessibility_1');
        map.getPane('pane_01_healthcare_accessibility_1').style.zIndex = 401;
        map.getPane('pane_01_healthcare_accessibility_1').style['mix-blend-mode'] = 'normal';
        var layer_01_healthcare_accessibility_1 = new L.geoJson(json_01_healthcare_accessibility_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_01_healthcare_accessibility_1',
            layerName: 'layer_01_healthcare_accessibility_1',
            pane: 'pane_01_healthcare_accessibility_1',
            onEachFeature: pop_01_healthcare_accessibility_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_01_healthcare_accessibility_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_01_healthcare_accessibility_1);
        map.addLayer(layer_01_healthcare_accessibility_1);
        var overlaysTree = [
            {label: '01_healthcare_accessibility<br /><table><tr><td style="text-align: center;"><img src="legend/01_healthcare_accessibility_1_SpecialistHospital0.png" /></td><td>Specialist Hospital</td></tr><tr><td style="text-align: center;"><img src="legend/01_healthcare_accessibility_1_PrimaryCareCenter1.png" /></td><td>Primary Care Center</td></tr><tr><td style="text-align: center;"><img src="legend/01_healthcare_accessibility_1_GeneralHospital2.png" /></td><td>General Hospital</td></tr><tr><td style="text-align: center;"><img src="legend/01_healthcare_accessibility_1_Clinic3.png" /></td><td>Clinic</td></tr><tr><td style="text-align: center;"><img src="legend/01_healthcare_accessibility_1_4.png" /></td><td></td></tr></table>', layer: layer_01_healthcare_accessibility_1},
            {label: "OSM Web", layer: layer_OSMWeb_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        map.on("zoomend", function(){

                if (map.hasLayer(layer_01_healthcare_accessibility_1)) {
                    if (map.getZoom() <= 14 && map.getZoom() >= 19) {
                        layer_01_healthcare_accessibility_1.eachLayer(function (layer) {
                            layer.openTooltip();
                        });
                    } else {
                        layer_01_healthcare_accessibility_1.eachLayer(function (layer) {
                            layer.closeTooltip();
                        });
                    }
                }
        });
        setBounds();
        var i = 0;
        layer_01_healthcare_accessibility_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Facility_Name'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Facility_Name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_01_healthcare_accessibility_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
                if (map.hasLayer(layer_01_healthcare_accessibility_1)) {
                    if (map.getZoom() <= 14 && map.getZoom() >= 19) {
                        layer_01_healthcare_accessibility_1.eachLayer(function (layer) {
                            layer.openTooltip();
                        });
                    } else {
                        layer_01_healthcare_accessibility_1.eachLayer(function (layer) {
                            layer.closeTooltip();
                        });
                    }
                }
        resetLabels([layer_01_healthcare_accessibility_1]);
        map.on("zoomend", function(){
            resetLabels([layer_01_healthcare_accessibility_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_01_healthcare_accessibility_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_01_healthcare_accessibility_1]);

        </script>
